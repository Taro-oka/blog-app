<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="50%" stop-color="#111f36" />
      <stop offset="100%" stop-color="#152742" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#4de4ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7c5dff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#111f36" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8f0ff" />
      <stop offset="100%" stop-color="#8ad3ff" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5dff" />
      <stop offset="100%" stop-color="#4de4ff" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="600" cy="600" r="580" />
    </clipPath>
  </defs>

  <!-- circular base -->
  <circle cx="600" cy="600" r="600" fill="url(#bgGradient)" />

  <!-- clipped content for smooth round edges -->
  <g clip-path="url(#circleClip)">
    <circle cx="600" cy="500" r="500" fill="url(#bgGlow)" />
    <g transform="translate(92 500)">
      <rect x="0" y="0" width="656" height="200" fill="none" />
      <text font-size="180" fill="url(#textGradient)" font-family="Poppins, 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" letter-spacing="6">
        <tspan x="0" y="141">Devlog</tspan>
      </text>
    </g>
    <svg x="788" y="440" width="320" height="320" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g fill="url(#iconGradient)">
